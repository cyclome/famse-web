<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>FAMSE</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Language toggle (web only) -->
  <div id="lang">
    <button type="button" data-lang="da">DA</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <!-- 1 · Landing -->
  <section id="landing" class="screen active"><div class="pane">
    <img class="logo" src="logo.png" alt="FAMSE">
    <h1>FAMSE</h1>
    <p class="muted" data-i18n="app.subtitle"></p>
    <p data-i18n="landing.intro"></p>
    <p class="muted" data-i18n="landing.privacy"></p>
    <div class="spacer"></div>
    <button class="btn" data-go="screening" data-i18n="btn.start"></button>
  </div></section>

  <!-- 2 · Screening -->
  <section id="screening" class="screen"><div class="pane">
    <h2 data-i18n="screening.heading"></h2>
    <form id="screeningForm"></form>
    <div class="err" id="screeningErr"></div>
    <button class="btn" id="screeningNext" data-i18n="btn.continue"></button>
  </div></section>

  <!-- 3 · Instructions -->
  <section id="intro" class="screen"><div class="pane">
    <h2 data-i18n="intro.heading"></h2>
    <p data-i18n="intro.body"></p>
    <p class="muted" data-i18n="intro.note"></p>
    <div class="spacer"></div>
    <button class="btn" data-go="q1" data-i18n="btn.continue"></button>
  </div></section>

  <!-- 4 · Pre-test Q1 -->
  <section id="q1" class="screen"><div class="pane">
    <h2 data-i18n="q1.text"></h2>
    <button class="btn" data-go="q2" data-i18n="btn.yes"></button>
  </div></section>

  <!-- 5 · Pre-test Q2 -->
  <section id="q2" class="screen"><div class="pane">
    <h2 data-i18n="q2.text"></h2>
    <button class="btn" id="toCountdown" data-i18n="btn.yes"></button>
  </div></section>

  <!-- 6 · Countdown -->
  <section id="countdown" class="screen"><div class="pane">
    <p data-i18n="countdown.label"></p>
    <div class="count" id="count">3</div>
  </div></section>

  <!-- 7 · Test -->
  <section id="test" class="screen">
    <div class="top"><div id="digit"></div></div>
    <div class="bottom"><div id="tapbtn" role="button" aria-label="Tryk" data-i18n="test.tap"></div></div>
  </section>

  <!-- 8 · Done -->
  <section id="done" class="screen"><div class="pane">
    <img class="logo" src="logo.png" alt="FAMSE">
    <h2 data-i18n="done.heading"></h2>
    <p class="muted" id="doneMsg" data-i18n="done.msg"></p>
    <div class="spacer"></div>
    <a class="dl" id="downloadLink" href="#" data-i18n="done.download"></a>
  </div></section>

  <script src="sequences.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
